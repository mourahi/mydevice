name: macOS + Tailscale + VNC

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:
      - name: Configure macOS VNC / Screen Sharing
        run: |
          echo "=== Activation du partage d'écran (VNC) ==="
          # Active le service de partage d'écran (Remote Desktop / VNC)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users admin -privs -all -restart -agent -menu

          # Force le serveur VNC à accepter l'authentification
          sudo defaults write /Library/Preferences/com.apple.AppleVNCServer VNCAuthenticationEnabled -int 1
          echo "VNC configuré."

      - name: Set up VNC / System User Password
        run: |
          # Changement du mot de passe de l'utilisateur 'runner'
          echo "runner:adil@2026" | sudo chpasswd
          echo "Mot de passe utilisateur mis à jour avec succès."

      - name: Install Tailscale
        run: |
          echo "=== Installation de Tailscale ==="
          brew install --cask tailscale

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "=== Connexion à Tailscale ==="
          sudo /Applications/Tailscale.app/Contents/MacOS/Tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-macos-$GITHUB_RUN_ID

          # Attente de l'attribution de l'IP Tailscale
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(/Applications/Tailscale.app/Contents/MacOS/Tailscale ip -4)
              sleep 5
              RETRIES=$((RETRIES + 1))
          done

          if [ -z "$TS_IP" ]; then
              echo "Erreur: IP Tailscale non assignée."
              exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Adresse IP Tailscale attribuée : $TS_IP"

      - name: Verify VNC Port Accessibility
        run: |
          TS_IP=$(/Applications/Tailscale.app/Contents/MacOS/Tailscale ip -4)
          echo "Vérification du port VNC (5900) sur $TS_IP"
          nc -zv $TS_IP 5900 || echo "Le port VNC peut être filtré mais le service tourne localement."

      - name: Maintain Connection & Download Script
        run: |
          echo ""
          echo "=== ACCÈS DISTANT MAC (VNC) ==="
          TS_IP=$(/Applications/Tailscale.app/Contents/MacOS/Tailscale ip -4)
          echo "Adresse VNC : vnc://$TS_IP"
          echo "Username    : runner"
          echo "Password    : adil@2026"
          echo "==============================="
          echo ""

          # Pour exécuter un script bash distant si besoin :
          # DOWNLOAD_URL="https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.sh"
          # curl -sL $DOWNLOAD_URL -o /tmp/Downloads.sh && chmod +x /tmp/Downloads.sh && /tmp/Downloads.sh || true

          # Maintient le runner en vie
          while true; do
              echo "[$(date)] Mac VNC Session Active - Utilisez Ctrl+C dans le workflow pour terminer"
              sleep 300
          done
