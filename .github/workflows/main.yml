name: macOS + Tailscale + SSH & VNC

on:
  workflow_dispatch:

jobs:
  secure-ssh-vnc:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:
      - name: Check Tailscale Secret
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ]; then
              echo "❌ ERREUR : Le secret 'TAILSCALE_AUTHKEY' est introuvable."
              exit 1
          fi
          echo "✅ Secret Tailscale détecté."

      - name: Setup SSH Public Key & Enable SSH
        env:
          SSH_PUB_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          echo "=== Configuration de la clé SSH pour 'runner' ==="
          mkdir -p /Users/runner/.ssh
          if [ ! -z "$SSH_PUB_KEY" ]; then
              echo "$SSH_PUB_KEY" >> /Users/runner/.ssh/authorized_keys
              echo "✅ Clé publique SSH ajoutée."
          else
              echo "⚠️ Attention : SSH_PUBLIC_KEY est vide."
          fi
          chmod 700 /Users/runner/.ssh
          chmod 600 /Users/runner/.ssh/authorized_keys
          sudo chown -R runner:staff /Users/runner/.ssh

          echo "=== Activation du service SSH ==="
          sudo systemsetup -setremotelogin on
          echo "✅ SSH activé."

      - name: Configure macOS VNC & Auto-Login Session
        run: |
          echo "=== Activation du serveur VNC et déverrouillage de la session ==="
          sudo sysadminctl -resetPasswordFor runner -newPassword "adil@2026"
          
          # Activation du Remote Desktop / VNC avec prise en charge du mot de passe
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpasswd "adil@2026" \
            -restart -agent -privs -all

          sudo defaults write /Library/Preferences/com.apple.AppleVNCServer VNCAuthenticationEnabled -int 1
          echo "✅ Service VNC configuré."

      - name: Install Tailscale CLI
        run: |
          brew install tailscale

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo tailscaled --tun=userspace-networking &
          sleep 3
          sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname=gh-runner-macos-$GITHUB_RUN_ID --accept-routes

          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 20 ]; do
              TS_IP=$(tailscale ip -4 2>/dev/null || true)
              sleep 5
              RETRIES=$((RETRIES + 1))
          done

          if [ -z "$TS_IP" ]; then
              echo "❌ Erreur : Impossible d'obtenir l'IP Tailscale"
              exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "✅ IP Tailscale attribuée : $TS_IP"

      - name: Maintain Connection & Summary
        run: |
          TS_IP=$(tailscale ip -4)
          echo ""
          echo "=================================================="
          echo "🎉 MAC DISTANT PRÊT EN SSH ET VNC !"
          echo "=================================================="
          echo "📡 Connexion SSH depuis Fedora :"
          echo "   ssh runner@$TS_IP"
          echo "--------------------------------------------------"
          echo "🖥️  Accès VNC Graphique depuis Fedora :"
          echo "   1. Dans un terminal : ssh -L 5900:localhost:5900 runner@$TS_IP"
          echo "   2. Dans 'Connexions' : vnc://localhost"
          echo "=================================================="
          echo ""

          # Maintien de la session active en arrière-plan
          while true; do
              echo "[$(date)] Session active..."
              sleep 300
          done
