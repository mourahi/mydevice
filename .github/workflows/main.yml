name: Linux + Tailscale + Custom Script

on:
  workflow_dispatch:

jobs:
  secure-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start and Connect Tailscale
        run: |
          # Démarrer le service Tailscale sous Linux (systemd ou en arrière-plan)
          sudo systemctl enable --now tailscaled
          
          # Connexion avec la clé d'authentification
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-linux-$GITHUB_RUN_ID
          
          # Récupération de l'adresse IP Tailscale
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP assigned: $TS_IP"

      - name: Verify Connectivity
        run: |
          echo "=== LINUX ACCESS INFO ==="
          echo "Tailscale IP: ${{ env.TAILSCALE_IP }}"
          echo "========================="
          
          # Test de port SSH
          nc -zv ${{ env.TAILSCALE_IP }} 22 || true

      - name: Download and Run Startup Script
        run: |
          SCRIPT_URL="https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/startup.sh"
          TARGET_PATH="$HOME/Downloads/startup.sh"
          
          mkdir -p "$HOME/Downloads"
          curl -L "$SCRIPT_URL" -o "$TARGET_PATH"
          
          chmod +x "$TARGET_PATH"
          echo "✔ Script downloaded successfully"
          
          bash "$TARGET_PATH" || true

      - name: Keep Runner Alive
        run: |
          echo "Keeping runner alive for maintenance..."
          while true; do
            date
            sleep 300
          done
