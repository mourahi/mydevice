name: macOS + Tailscale + SSH Key

on:
  workflow_dispatch:

jobs:
  secure-ssh:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:
      - name: Check Tailscale Secret
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ]; then
              echo "❌ ERREUR : Le secret 'TAILSCALE_AUTHKEY' est introuvable."
              exit 1
          fi
          echo "✅ Secret détecté."

      - name: Setup SSH Public Key & Enable SSH
        env:
          SSH_PUB_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          echo "=== Configuration de la clé SSH pour 'runner' ==="
          mkdir -p /Users/runner/.ssh
          echo "$SSH_PUB_KEY" >> /Users/runner/.ssh/authorized_keys
          chmod 700 /Users/runner/.ssh
          chmod 600 /Users/runner/.ssh/authorized_keys
          sudo chown -R runner:staff /Users/runner/.ssh

          echo "=== Activation du service SSH ==="
          sudo systemsetup -setremotelogin on
          echo "✅ SSH configuré avec succès."

      - name: Install Tailscale CLI
        run: |
          brew install tailscale

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo tailscaled --tun=userspace-networking &
          sleep 3
          sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname=gh-runner-macos-$GITHUB_RUN_ID --accept-routes

          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 20 ]; do
              TS_IP=$(tailscale ip -4 2>/dev/null || true)
              sleep 5
              RETRIES=$((RETRIES + 1))
          done

          if [ -z "$TS_IP" ]; then
              echo "❌ Erreur IP Tailscale"
              exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "✅ IP Tailscale : $TS_IP"

      - name: Maintain Connection & Summary
        run: |
          TS_IP=$(tailscale ip -4)
          echo ""
          echo "=================================================="
          echo "🎉 MAC DISTANT PRÊT EN SSH (SANS MOT DE PASSE) !"
          echo "=================================================="
          echo "📡 Commande depuis Fedora : ssh runner@$TS_IP"
          echo "=================================================="
          echo ""

          while true; do
              echo "[$(date)] Session SSH active..."
              sleep 300
          done
