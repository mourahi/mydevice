name: macOS + Tailscale Access

on:
  workflow_dispatch:

jobs:
  secure-mac:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:
      - name: Check Tailscale Secret
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ]; then
              echo "❌ ERREUR : Le secret 'TAILSCALE_AUTHKEY' n'est pas défini dans GitHub Secrets."
              exit 1
          fi
          echo "✅ Secret trouvé."

      - name: Configure System Password & Enable SSH
        run: |
          echo "=== Activation SSH & Mot de passe ==="
          sudo sysadminctl -resetPasswordFor runner -newPassword "adil@2026"
          sudo systemsetup -setremotelogin on
          echo "✅ SSH activé."

      - name: Install & Launch Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "=== Installation de Tailscale ==="
          brew install tailscale
          sudo tailscaled --tun=userspace-networking &
          sleep 3

          echo "=== Connexion ==="
          sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname=gh-runner-mac-$GITHUB_RUN_ID --accept-routes

          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 20 ]; do
              TS_IP=$(tailscale ip -4 2>/dev/null || true)
              if [ -z "$TS_IP" ]; then
                  echo "⏳ Attente de l'IP Tailscale ($RETRIES/20)..."
                  sleep 5
              fi
              RETRIES=$((RETRIES + 1))
          done

          if [ -z "$TS_IP" ]; then
              echo "❌ Impossible d'obtenir l'IP Tailscale."
              exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "✅ IP attribuée : $TS_IP"

      - name: Maintain Connection & Summary
        run: |
          TS_IP=$(tailscale ip -4)
          echo ""
          echo "=================================================="
          echo "🎉 MAC DISTANT EN LIGNE ET PRÊT !"
          echo "=================================================="
          echo "📡 Adresse IP Tailscale : $TS_IP"
          echo "👤 Username             : runner"
          echo "🔑 Password             : adil@2026"
          echo "--------------------------------------------------"
          echo "💻 Connexion SSH (Recommandée) :"
          echo "   ssh runner@$TS_IP"
          echo "=================================================="
          echo ""

          while true; do
              echo "[$(date)] Session Mac active..."
              sleep 300
          done
