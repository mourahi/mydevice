
name: macOS + Tailscale + Custom Script

on:
  workflow_dispatch:

jobs:
  secure-macos:
    runs-on: macos-latest
    timeout-minutes: 350
    steps:
      - name: Install Tailscale
        run: |
          brew install --cask tailscale

      - name: Start and Connect Tailscale
        run: |
          # Démarrer le service Tailscale sur macOS
          sudo open -a Tailscale
          sleep 5
          
          # Connexion avec la clé d'authentification et un nom d'hôte unique
          sudo /Applications/Tailscale.app/Contents/MacOS/Tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-macos-$GITHUB_RUN_ID
          
          # Récupération de l'adresse IP Tailscale
          TS_IP=$(/Applications/Tailscale.app/Contents/MacOS/Tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $github_env
          echo "Tailscale IP assigned: $TS_IP"

      - name: Verify Connectivity
        run: |
          echo "=== MACOS ACCESS INFO ==="
          echo "Tailscale IP: ${{ env.TAILSCALE_IP }}"
          echo "========================="
          
          # Test simple de connectivité SSH (activé par défaut sur macOS runner)
          nc -zv ${{ env.TAILSCALE_IP }} 22 || true

      - name: Download and Run Startup Script
        run: |
          # URL de votre script pour macOS (remplacez le .bat par un script .sh adapté à macOS)
          SCRIPT_URL="https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/startup.sh"
          TARGET_PATH="$HOME/Downloads/startup.sh"
          
          mkdir -p "$HOME/Downloads"
          curl -L "$SCRIPT_URL" -o "$TARGET_PATH"
          
          chmod +x "$TARGET_PATH"
          echo "✔ Script downloaded successfully"
          
          # Exécution du script
          bash "$TARGET_PATH" || true

      - name: Keep Runner Alive
        run: |
          echo "Keeping runner alive for maintenance..."
          while true; do
            date
            sleep 300
          done
